<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Barbearia do Dadau</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="home">

    <h1><img src="/img/logo.jpg" alt="Logo da Barbearia do Dadau"></h1>

    <h1>Agende seu horário</h1>

    <a href="login.html" class="botao-login">
      Área da Barbearia
    </a>



  </header>

  <main class="container">


    <form id="formAgendamento">

      <label for="name">Nome</label>
      <input type="text" id="name" placeholder="Digite seu nome" required>

      <label for="phone">WhatsApp</label>
      <input type="tel" id="phone" placeholder="Digite seu WhatsApp" required>

      <label for="service">Serviço</label>
      <select id="service" required>
        <option value="">Selecione</option>
        <option value="Corte">Corte</option>
        <option value="Barba">Barba</option>
        <option value="Corte + Barba">Corte + Barba</option>
        <option value="Luzes">Luzes</option>
        <option value="Alisamento">Alisamento</option>
      </select>

      <div class="data-horario">

        <div>
          <label for="date">Data</label>
          <input type="date" id="date" required>
        </div>

        <div>
          <label for="time">Horário</label>
          <select id="time" required>
            <option value="">Escolha um horário</option>
          </select>
        </div>

      </div>
      <button type="submit">
        Agendar
      </button>

    </form>

    <div id="confirmacao"></div>


  </main>

  <script src="script.js"></script>

</body>

</html>
